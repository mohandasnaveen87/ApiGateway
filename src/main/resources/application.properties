## Request Rate Limiter Filter Arguments
#spring.cloud.gateway.routes[0].filters[0].name=RequestRateLimiter
## Number of tokens added per second
#spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.replenishRate=1
## Maximum token capacity allowed in a single burst
#spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=20
## Number of tokens each request costs (defaults to 1 if omitted)
#spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.requestedTokens=1
